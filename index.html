<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashcard Library</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><section id="libraryView"><div class="top"><div class="brand"><h1>Flashcard Library</h1><p>Your board-exam reviewers in one place.</p></div><input id="search" class="search" placeholder="Search decks..."></div><div id="library" class="library"></div></section><section id="studyView" class="hidden"><button id="backBtn" class="btn back">← Back to Library</button><div class="study"><div class="card"><div class="bar"><div><strong id="deckTitle"></strong><div id="qTitle" class="note"></div></div><div class="stats"><span class="pill">✓ <span id="correctCount">0</span></span><span class="pill">✕ <span id="wrongCount">0</span></span><span class="pill"><span id="answeredCount">0</span>/<span id="totalCount">0</span></span></div></div><div class="slide"><img id="qImage" alt="Question"></div><div id="choices" class="choices"></div><div id="explain" class="explain hidden"></div><div class="controls"><button id="prevBtn" class="btn">← Previous</button><button id="nextBtn" class="btn primary">Next →</button><button id="revealBtn" class="btn">Reveal</button><button id="resetBtn" class="btn">Reset Deck</button></div></div><aside class="ai"><div class="aihead"><h3>AI Study Tutor</h3><p>Ask about the current question, formulas, concepts, or why an option is wrong.</p></div><div id="chat" class="chat"><div class="msg ai">Open a question and ask me about it.</div></div><div class="ask"><textarea id="askBox" placeholder="Example: Explain this using a calculator shortcut..."></textarea><div class="askrow"><button id="askBtn" class="btn primary">Ask AI</button><button id="clearChatBtn" class="btn">Clear</button></div><div id="aiStatus" class="note"></div></div></aside></div></section></div><script src="config.js"></script><script src="app.js"></script></body></html>
